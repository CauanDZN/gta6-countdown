<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>GTA VI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="slides"></div>
  <div id="scrim"></div>
  <div id="glow"></div>
  <main>
    <h1>GTA VI</h1>
    <p id="subtitle">19 de novembro de 2026</p>
    <div id="clock">
      <div class="unit"><span id="d">00</span><label>dias</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="h">00</span><label>horas</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="m">00</span><label>min</label></div>
      <div class="sep">:</div>
      <div class="unit"><span id="s">00</span><label>seg</label></div>
    </div>
    <p id="done" hidden>Chegou. Bom jogo.</p>
  </main>
  <p id="credit">Feito com amor pelo Cauan</p>
  <script src="app.js"></script>
</body>
</html>
